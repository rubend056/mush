[package]
name = "mush"
description = "A small, fast, agent-agnostic terminal editor with a built-in coding agent."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "mush"
path = "src/main.rs"

[dependencies]
mush-core = { path = "../mush-core" }
ratatui = "0.29"
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
unicode-width = "0.2"
tempfile.workspace = true
unicode-segmentation.workspace = true
unicode-truncate.workspace = true
# `flock(2)` for the one-mush-per-workspace lock. The workspace forbids
# `unsafe`, so the syscall comes from a safe wrapper rather than a hand-written
# `extern "C"`; rustix is already in the tree under tempfile and rustls.
rustix = { version = "1", features = ["fs", "process"] }
# The signal road: a handler that only sets a flag the event loop reads, so a
# killed mush ends through the same cleanup `Ctrl-Q` runs (finding E1). Not a
# new crate in the build — crossterm already links `signal-hook` — and the road
# `rustix` cannot offer safely: its `sigaction` is `unsafe`, `doc(hidden)` and
# documented as unusable beside libc, and this workspace forbids `unsafe`.
signal-hook = "0.3"
# TLS so hosted https endpoints (e.g. DeepSeek) work; the HTTP client itself
# stays hand-rolled and blocking. ring, not rustls's default aws-lc-rs: that
# provider is a C library built through cmake into every target dir, which no
# Rust cache can reuse — ~22 s of a 36.5 s cold `cargo build -p mush` in the
# probe, and a re-measure today put cold `cargo test --workspace --no-run` at
# 69.3 s with it against 39.2 s with ring (−43 % wall, −30 % CPU).
# No `prefer-post-quantum`: on rustls 0.23 it turns aws_lc_rs back on, so the
# handshake offers X25519/secp256r1/secp384r1 and not the X25519MLKEM768
# hybrid — the cost, named in the commit body.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"

# The same crate, with the test-support feature on, for this binary's tests
# only: the scratch guard (`mush_core::scratch`) a test root is owned by. A
# plain `cargo build` does not consult this table, so the guard is never in the
# product.
[dev-dependencies]
mush-core = { path = "../mush-core", features = ["test-support"] }

[lints]
workspace = true
