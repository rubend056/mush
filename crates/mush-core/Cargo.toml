[package]
name = "mush-core"
description = "The agent-agnostic core of mush: workspace, sessions, configuration, prompts."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The test-support scratch guard (`src/scratch.rs`): a root a test owns and
# removes by `Drop`. A product build never compiles it; `mush`'s own tests
# reach it through the `dev-dependencies` entry in its manifest, which turns
# the feature on for test builds only.
test-support = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
dirs.workspace = true
# Display-column arithmetic (`text.rs`): the same width the renderer paints.
unicode-width = "0.2"
unicode-truncate = "1.1"

[lints]
workspace = true
