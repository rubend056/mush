[workspace]
resolver = "2"
members = ["crates/mush-core", "crates/mush"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.74"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
# Secure scratch files (agent command output) and atomic writes.
tempfile = "3"
# Directory walks with a real per-entry API instead of a hand-rolled stack.
walkdir = "2"
# Platform-correct config locations.
dirs = "6"
# Cursor edits by grapheme cluster, and display-width truncation that matches
# what the renderer actually paints.
unicode-segmentation = "1"
unicode-truncate = "1.1"

# mush is a terminal application that talks to the network and shells out. It
# has never needed `unsafe`, and it should stay that way.
[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
